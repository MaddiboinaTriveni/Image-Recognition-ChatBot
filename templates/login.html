<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | Image Recognition Chatbot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body class="login-page">
  <div class="auth-shell">
    <div class="auth-panel glass-panel">
      <div class="auth-brand">
        <div class="auth-badge"><i class="fas fa-robot"></i></div>
        <div>
          <h1>Sign in</h1>
          <p>Access secure AI image recognition and insights.</p>
        </div>
      </div>

      <form method="POST" action="{{ url_for('login') }}" class="auth-form">
        <div class="form-row">
          <label for="username">Username</label>
          <input id="username" name="username" type="text" placeholder="Enter your username" required />
        </div>
        <div class="form-row">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" placeholder="Enter your password" required />
        </div>

        <div class="form-options">
          <label class="checkbox-row"><input type="checkbox" name="remember" /> Remember me</label>
          <a href="#">Forgot password?</a>
        </div>

        <button class="btn btn-primary btn-block" type="submit">Login</button>
      </form>

      {% if error %}
      <div class="notification error-notice">{{ error }}</div>
      {% endif %}

      <p class="auth-help">New here? <a href="#">Create an account</a></p>
    </div>
  </div>

  <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
